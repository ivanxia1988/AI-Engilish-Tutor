<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teeko talking demo</title>
<style>
body{margin:0;background:#FBF8F2;font-family:Inter,"Noto Sans SC",system-ui,sans-serif;color:#1F2A44;display:flex;gap:32px;padding:32px;flex-wrap:wrap}
.card{background:#fff;border:1px solid #EDE5D6;border-radius:20px;padding:20px;width:340px}
.card img,.card svg{width:300px;height:375px;display:block;margin:0 auto}
h2{font:800 18px/1.2 Nunito,sans-serif;margin:0 0 4px}p{margin:0 0 12px;color:#4A5268;font-size:14px;line-height:1.6}
button{height:48px;padding:0 20px;border-radius:999px;border:0;background:#1F2A44;color:#F6F1E7;font:600 15px/1 Inter,sans-serif;cursor:pointer}
.meter{height:8px;border-radius:99px;background:#EDE5D6;margin:12px 0;overflow:hidden}.meter i{display:block;height:100%;width:0;background:#2A9D8F}
code{font-size:12px;color:#5E6478}
</style></head><body>
<div class="card"><h2>1 · CSS 循环（无脚本）</h2><p>svg/teeko-talking-loop.svg：16 帧 × 90ms 口型序列 + 眨眼 + 头部轻摆。适合加载中、示例播放。</p><img src="svg/teeko-talking-loop.svg" alt="Teeko talking"></div>
<div class="card"><h2>2 · 音量驱动口型</h2><p>真实使用时，用 TTS 音频的音量（RMS）每 ~80ms 选一个口型。没有音频时用模拟音量演示。</p>
<div id="rig"><svg width="240" height="300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" ><title>Teeko rig — swap .on between #mouth-closed/#mouth-small/#mouth-wide/#mouth-oo</title><style>.mouth-slot>g{display:none}.mouth-slot>g.on{display:inline}</style><ellipse class="ground" cx="120" cy="285" rx="58.0" ry="7.0" fill="#1F2A44" opacity=".12"/><g class="sparrow"><g class="feet" stroke="#E39A1A" stroke-linecap="round" fill="none"><path d="M102,258 V273" stroke-width="7"/><path d="M102,273 l-9,6 M102,273 l0,8 M102,273 l9,6" stroke-width="5.5"/><path d="M138,258 V273" stroke-width="7"/><path d="M138,273 l-9,6 M138,273 l0,8 M138,273 l9,6" stroke-width="5.5"/></g><g class="tail"><path d="M168,232 C186,234 206,240 218,252 C204,256 186,254 170,246 Z" fill="#D7631F"/><path d="M166,240 C182,248 196,258 202,270 C188,268 174,260 164,250 Z" fill="#EE7A30"/></g><g class="tuft"><path d="M114,44 C104,30 104,18 110,10 C118,18 120,32 118,44 Z" fill="#EE7A30"/><path d="M120,44 C122,30 128,20 138,16 C138,28 132,38 124,46 Z" fill="#D7631F"/></g><defs><clipPath id="clip-body"><ellipse cx="120" cy="202" rx="72" ry="62"/></clipPath><clipPath id="clip-head"><circle cx="120" cy="112" r="76"/></clipPath></defs><g class="body"><ellipse cx="120" cy="202" rx="72" ry="62" fill="#EE7A30"/><ellipse cx="120" cy="218" rx="52" ry="50" fill="#FFF4DF" clip-path="url(#clip-body)"/></g><g class="wing wing-l" transform="translate(66,172) scale(-1,1) rotate(10)"><path d="M-7,-6 C13,-12 27,8 25,40 C24,58 10,70 -3,63 C-13,55 -15,14 -7,-6 Z" fill="#D7631F"/><path d="M4,30 C8,40 8,50 3,57" stroke="#EE7A30" stroke-width="3" stroke-linecap="round" fill="none" opacity=".7"/></g><g class="wing wing-r" transform="translate(174,172) scale(1,1) rotate(10)"><path d="M-7,-6 C13,-12 27,8 25,40 C24,58 10,70 -3,63 C-13,55 -15,14 -7,-6 Z" fill="#D7631F"/><path d="M4,30 C8,40 8,50 3,57" stroke="#EE7A30" stroke-width="3" stroke-linecap="round" fill="none" opacity=".7"/></g><g class="head"><circle cx="120" cy="112" r="76" fill="#EE7A30"/><ellipse cx="120" cy="142" rx="68" ry="58" fill="#FFF4DF" clip-path="url(#clip-head)"/><path d="M70,82 C80,62 100,52 118,50" stroke="#F59A5A" stroke-width="5" stroke-linecap="round" fill="none" opacity=".55"/><g class="cheeks" opacity=".9"><ellipse cx="68" cy="150" rx="12" ry="7.5" fill="#F79E98"/><ellipse cx="172" cy="150" rx="12" ry="7.5" fill="#F79E98"/></g><g class="eyes eyes-open"><ellipse cx="92" cy="121" rx="11" ry="13.5" fill="#1F2A44"/><circle cx="95.6" cy="116.2" r="4.2" fill="#FFFFFF"/><circle cx="88.6" cy="126" r="1.8" fill="#FFFFFF" opacity=".8"/><ellipse cx="148" cy="121" rx="11" ry="13.5" fill="#1F2A44"/><circle cx="151.6" cy="116.2" r="4.2" fill="#FFFFFF"/><circle cx="144.6" cy="126" r="1.8" fill="#FFFFFF" opacity=".8"/></g><g class="eyes eyes-blink" style="display:none"><path d="M83,122 Q92,127 101,122" stroke="#1F2A44" stroke-width="4.5" stroke-linecap="round" fill="none"/><path d="M139,122 Q148,127 157,122" stroke="#1F2A44" stroke-width="4.5" stroke-linecap="round" fill="none"/></g><g class="mouth-slot" transform="translate(120,142) scale(1.22) translate(-120,-142)"><g id="mouth-closed" class="on" data-viseme="closed"><path d="M109,147 Q120,161 131,147 Q120,155 109,147 Z" fill="#E39A1A"/><path class="beak-upper" d="M103,137 C110,128.5 130,128.5 137,137 C133.5,145 127,151 120,155.5 C113,151 106.5,145 103,137 Z" fill="#FCC23A"/><path d="M110,134.5 C114,132.5 119,132 123,132.6" stroke="#FFE08A" stroke-width="2.4" stroke-linecap="round" fill="none"/></g><g id="mouth-small" data-viseme="small"><path d="M107,145 Q120,166 133,145 Z" fill="#9E3A17"/><path d="M107,145 Q120,170 133,145 Q120,163 107,145 Z" fill="#E39A1A"/><path class="beak-upper" d="M103,137 C110,128.5 130,128.5 137,137 C133.5,145 127,151 120,155.5 C113,151 106.5,145 103,137 Z" fill="#FCC23A"/><path d="M110,134.5 C114,132.5 119,132 123,132.6" stroke="#FFE08A" stroke-width="2.4" stroke-linecap="round" fill="none"/></g><g id="mouth-wide" data-viseme="wide"><path d="M104,143 Q120,183 136,143 Z" fill="#9E3A17"/><ellipse cx="120" cy="156" rx="7.5" ry="4.2" fill="#F2806F"/><path d="M104,143 Q120,188 136,143 Q120,178 104,143 Z" fill="#E39A1A"/><path class="beak-upper" d="M103,137 C110,128.5 130,128.5 137,137 C133.5,145 127,151 120,155.5 C113,151 106.5,145 103,137 Z" fill="#FCC23A"/><path d="M110,134.5 C114,132.5 119,132 123,132.6" stroke="#FFE08A" stroke-width="2.4" stroke-linecap="round" fill="none"/></g><g id="mouth-oo" data-viseme="oo"><ellipse cx="120" cy="155" rx="7" ry="7.5" fill="#9E3A17"/><path d="M111,152 Q111,167.5 120,167.5 Q129,167.5 129,152 Q127.5,163 120,163 Q112.5,163 111,152 Z" fill="#E39A1A"/><path class="beak-upper" d="M107,137 C112,129 128,129 133,137 C131,144 126,149 120,152 C114,149 109,144 107,137 Z" fill="#FCC23A"/><path d="M112,134.5 C115,133 119,132.6 122,133" stroke="#FFE08A" stroke-width="2.2" stroke-linecap="round" fill="none"/></g></g></g></g></svg></div><div class="meter"><i id="m"></i></div><code id="v">viseme: closed</code></div>
<script>
// Viseme driver: amplitude 0..1 -> closed / small / wide, plus 'oo' when the TTS gives a rounded vowel (o, u, w) or as a 15% variation on mid levels.
const slot = document.querySelector('#rig .mouth-slot');
const groups = {closed:'#mouth-closed', small:'#mouth-small', wide:'#mouth-wide', oo:'#mouth-oo'};
let current = 'closed', held = 0;
function setViseme(v){ if(v===current) return; slot.querySelector(groups[current]).classList.remove('on'); slot.querySelector(groups[v]).classList.add('on'); current=v; document.getElementById('v').textContent='viseme: '+v; }
function pick(a, hint){ if(hint==='oo') return 'oo'; if(a<0.08) return 'closed'; if(a<0.32) return Math.random()<0.15?'oo':'small'; return 'wide'; }
let t=0; let smooth=0;
function tick(){ // simulated speech envelope; replace `a` with analyser RMS
  t+=0.08; const syll=Math.max(0,Math.sin(t*7.5))*(0.55+0.45*Math.sin(t*1.3)); const pause=(Math.sin(t*0.9)>0.82)?0:1;
  const a=syll*pause; smooth=smooth*0.35+a*0.65; document.getElementById('m').style.width=(smooth*100)+'%';
  if(held<=0){ setViseme(pick(smooth)); held=1; } else held--; // hold each viseme >= 80ms
}
setInterval(tick, 80);
</script></body></html>
